# Copied Sites are standalone projects and cannot inherit the monorepo policy.
# Temporary, narrowly scoped exception: upstream has not published a patched picomatch release.
# Remove this GHSA as soon as the dependency tree can use a fixed picomatch version.
audit:
  level: high
  ignore:
    - GHSA-fc5q-39xc-vjpf
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  esbuild: true
  fsevents: true
  sharp: true
  unrs-resolver: true
  workerd: true
storeDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}
cacheDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}/policy-cache
enableGlobalVirtualStore: false
# Reuse store files with clones or hardlinks before falling back to copies.
packageImportMethod: auto
# The explicit installer owns dependency setup, including restored workspaces.
verifyDepsBeforeRun: false
optimisticRepeatInstall: false
overrides:
  miniflare>sharp: 0.35.5
  undici: 7.30.1
  ws: 8.21.0
  browserslist: 4.28.7
  source-map-js: 1.2.2
  brace-expansion@^1: 1.1.20
  brace-expansion@^5: 5.0.11
  js-yaml@^4: 4.3.2
  image-size@^2: 2.0.3
