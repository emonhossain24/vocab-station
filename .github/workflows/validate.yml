name: Vocab Station checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: vocab-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Enable exact package manager
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm --version
      - name: Install pinned dependencies (retry transient registry failures)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "pnpm install attempt ${attempt}/3"
            if pnpm install --frozen-lockfile; then exit 0; fi
            if [ "${attempt}" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          echo "Dependency installation failed after three attempts." >&2
          exit 1
      - name: TypeScript typecheck
        run: pnpm exec tsc --noEmit
      - name: Security policy checks
        run: node scripts/check-security.mjs
      - name: Ingress security behavior tests
        run: node scripts/check-ingress.mjs
      - name: Git history secret-pattern scan
        run: node scripts/check-history-secrets.mjs
      - name: Dependency audit (high or critical)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "pnpm audit attempt ${attempt}/3"
            if pnpm audit --audit-level high; then exit 0; fi
            if [ "${attempt}" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          echo "Dependency audit failed after three attempts." >&2
          exit 1
      - name: Vocabulary checks
        run: |
          node scripts/check-vocabulary.mjs
          node scripts/check-assessment-v3.mjs
          node scripts/check-access.mjs
          node scripts/check-gemini-assessment.mjs
      - name: Email signup and Cloudflare crypto compatibility
        run: node scripts/check-email-auth.mjs
      - name: Production build (retry transient failures)
        shell: bash
        run: |
          for attempt in 1 2; do
            echo "Production build attempt ${attempt}/2"
            if pnpm build; then exit 0; fi
            if [ "${attempt}" -lt 2 ]; then sleep 10; fi
          done
          exit 1
